# general params
seed: 42
timesteps: 30000 # 5 minutes at dt=0.01
dt: 0.01 # The discretization interval [s]
# imu noise params
gyro_time_constant: 1000 # Gauss Markov time constant for gyro [s]
accelerometer_time_constant: [1000.0, 1000.0] # Gauss Markov time constant for accelerometer [s]
gyro_noise_variance: 5e-5 # (rad/s)^2, bias instability
accelerometer_noise_variance: [5e-2, 5e-2] # (m/s^2)^2, bias instability
gyro_white_noise_intensity: 5e-4 # rad^2/s, angular random walk
accelerometer_white_noise_intensity: [5e-4, 5e-4] # (m/s^2)^2 * s, velocity random walk
# the filter's own belief about the IMU noise above, deliberately mistuned
# against the truth values here (1.6x gyro, 1.8x accel)
filter_gyro_time_constant: 1000
filter_accelerometer_time_constant: [1000.0, 1000.0]
filter_gyro_noise_variance: 8e-5
filter_accelerometer_noise_variance: [9e-2, 9e-2]
filter_gyro_white_noise_intensity: 5e-4
filter_accelerometer_white_noise_intensity: [5e-4, 5e-4]
# initial condition of the ASV: [x, y, psi, u, v, b_ax, b_ay, b_g]
x0: [0, 0, 0, 2.0, 0, 0, 0, 0] # start at origin with heading +x
p0_diagonal: [0.4, 0.4, 0.04, 0.04, 0.04, 0.004, 0.004, 0.0004]
# measurement noise
gnss_noise_variance: 0.20 # m^2, 1-sigma ~0.4m
gnss_and_heading_noise_variance: [0.20, 0.20, 1e-5] # m^2, m^2, rad^2 (heading 1-sigma ~0.18deg)
gnss_period_min: 1.0 # minimum period between GNSS measurements [s]
gnss_period_max: 3.0 # maximum period between GNSS measurements [s]
# GNSS denied for the middle 70% of the run: aided for the first and last
# 15% (0-45s and 255-300s), denied 45-255s
gnss_denied_start: 45.0 # [s]
gnss_denied_end: 255.0 # [s]
magnetometer_noise_variance: 3e-3 # rad^2, 1-sigma ~3deg
magnetometer_period_min: 0.25 # minimum period between magnetometer fixes [s]
magnetometer_period_max: 1.0 # maximum period between magnetometer fixes [s]
dvl_noise_variance: [1e-2, 1e-2] # (m/s)^2, (m/s)^2, body-frame velocity
dvl_period_min: 0.2 # minimum period between DVL fixes [s]
dvl_period_max: 1.0 # maximum period between DVL fixes [s]
# which trajectory to run: rounded_rectangle | circle | straight_into_turn
trajectory: rounded_rectangle
path_speed: 2 # constant speed along the path [m/s]
# rounded_rectangle: four straight sides with quarter-circle corners, looped
rectangle_width: 80.0
rectangle_height: 50.0
rectangle_corner_radius: 10.0
# circle: traced continuously, looped
circle_radius: 40.0
# straight_into_turn: straight, turn, then straight again
straight_length: 296.0
turn_radius: 5.0
turn_sweep_deg: 90.0 # degrees, positive = left
