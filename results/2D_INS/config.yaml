# exact config that produced data/ in this folder, frozen here since
# configs/strapdown_ins_2D.yaml keeps changing as later experiments are run
---
# general params
seed: 42
timesteps: 24000  # 4 minutes at dt=0.01
dt: 0.01  # The discretization interval [s]

# imu noise params, deliberataly a bit worse than an imu one would use
# realistically
gyro_time_constant: 1000  # Gauss Markov time constant for gyro [s]
# Gauss Markov time constant for accelerometer [s]
accelerometer_time_constant: [1000.0, 1000.0]
gyro_noise_variance: 5e-7  # (rad/s)^2, bias instability ~146 deg/hr
# (m/s^2)^2, bias instability ~2.3 mg
accelerometer_noise_variance: [5e-4, 5e-4]
gyro_white_noise_intensity: 5e-6  # rad^2/s, angular random walk
# (m/s^2)^2 * s, velocity random walk
accelerometer_white_noise_intensity: [5e-4, 5e-4]

# the filter's own belief about the IMU noise above -- matched in this run
filter_gyro_time_constant: 1000
filter_accelerometer_time_constant: [1000.0, 1000.0]
filter_gyro_noise_variance: 5e-7
filter_accelerometer_noise_variance: [5e-4, 5e-4]
filter_gyro_white_noise_intensity: 5e-6
filter_accelerometer_white_noise_intensity: [5e-4, 5e-4]

# initial condition of the ASV: [x, y, psi, u, v, b_ax, b_ay, b_g]
# u = path_speed; all three trajectories now start at the origin heading +x
x0: [0, 0, 0, 2.0, 0, 0, 0, 0]
p0_diagonal: [1, 1, 0.1, 0.1, 0.1, 0.01, 0.01, 0.001]

# measurement noise
gnss_noise_variance: 0.25  # m^2, 1-sigma ~0.5m
# m^2, m^2, rad^2 (heading 1-sigma ~0.18deg)
gnss_and_heading_noise_variance: [0.25, 0.25, 1e-5]
gnss_period_min: 5.0  # minimum period between GNSS measurements [s]
gnss_period_max: 15.0  # maximum period between GNSS measurements [s]

# which trajectory to run: rounded_rectangle | circle | straight_into_turn
trajectory: rounded_rectangle
path_speed: 2  # constant speed along the path [m/s]

# rounded_rectangle: four straight sides with quarter-circle corners, looped
rectangle_width: 80.0
rectangle_height: 50.0
rectangle_corner_radius: 10.0

# circle: traced continuously, looped
circle_radius: 15.0

# straight_into_turn: one straight then one turn, stops at the end
straight_length: 30.0
turn_radius: 10.0
turn_sweep_deg: 90.0  # degrees, positive = left
