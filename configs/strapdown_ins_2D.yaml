# general params 
seed: 42
timesteps: 60000 # 10 minutes at dt=0.01
dt: 0.01 # The discretization interval [s]
# imu noise params
gyro_time_constant: 1000 # Gauss Markov time constant for gyro [s]
accelerometer_time_constant: [1000.0, 1000.0] # Gauss Markov time constant for accelerometer [s]
gyro_noise_variance: 6e-10 # (rad/s)^2, bias instability ~5 deg/hr
accelerometer_noise_variance: [1e-6, 1e-6] # (m/s^2)^2, bias instability ~0.1 mg
gyro_white_noise_intensity: 3e-9 # rad^2/s, angular random walk ~0.2 deg/sqrt(hr)
accelerometer_white_noise_intensity: [7e-7, 7e-7] # (m/s^2)^2 * s, velocity random walk ~0.05 m/s/sqrt(hr)
# initial condition of the ASV: [x, y, psi, u, v, b_ax, b_ay, b_g]
x0: [0, 0, 0, 2.0, 0, 0, 0, 0] # u = path_speed; all three trajectories now start at the origin heading +x
p0_diagonal: [1, 1, 0.1, 0.1, 0.1, 0.01, 0.01, 0.001]
# measurement noise
gnss_noise_variance: 4.0 # m^2, standalone GNSS, 1-sigma ~2m
gnss_and_heading_noise_variance: [4.0, 4.0, 1.5e-4] # m^2, m^2, rad^2 (heading 1-sigma ~0.7deg)
gnss_period_min: 7.5 # minimum period between GNSS measurements [s]
gnss_period_max: 20.5 # maximum period between GNSS measurements [s]
# which trajectory to run: rounded_rectangle | circle | straight_into_turn

trajectory: rounded_rectangle
path_speed: 2.0 # constant speed along the path [m/s]
# rounded_rectangle: four straight sides with quarter-circle corners, looped
rectangle_width: 40.0
rectangle_height: 25.0
rectangle_corner_radius: 5.0
# circle: traced continuously, looped
circle_radius: 15.0
# straight_into_turn: one straight then one turn, stops at the end
straight_length: 30.0
turn_radius: 10.0
turn_sweep_deg: 90.0 # degrees, positive = left
