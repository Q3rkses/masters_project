# 2-D random walk observed directly:
#   x_k = x_{k-1} + w_k,  w_k ~ N(0, Q)  ->  F = I_2, Q = q * I_2
#   z_k = x_k     + v_k,  v_k ~ N(0, R)  ->  H = I_2, R = r * I_2
seed: 42
timesteps: 1000
dim: 2
q: 0.05        # process noise variance (random walk step size)
r: 0.5         # measurement noise variance
x0: [0.0, 0.0] # prior mean, one entry per dimension
p0: 1.0        # prior covariance is p0 * I
